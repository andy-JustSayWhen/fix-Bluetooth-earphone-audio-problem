icon = "tool"
platform = "win32"
command = '''
$ErrorActionPreference = 'Stop'
if ($env:OS -ne 'Windows_NT') { throw 'This action requires Windows.' }
$serviceIds = @(Get-NetTCPConnection -LocalPort 4173 -State Listen -ErrorAction SilentlyContinue | Select-Object -ExpandProperty OwningProcess -Unique)
foreach ($serviceId in $serviceIds) {
    $serviceProcess = Get-CimInstance Win32_Process -Filter "ProcessId = $serviceId"
